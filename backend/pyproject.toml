[project]
name = "document-intelligence-suite-backend"
version = "1.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",
    "B008",  # FastAPI's Depends()-as-default-argument pattern is idiomatic, not a bug
    "B905",  # zip() strict= not required here; iterables are always constructed same-length
    "UP042", # str+Enum (not StrEnum) is used deliberately for broad Pydantic/JSON compatibility
]

[tool.black]
line-length = 110
target-version = ["py311"]
